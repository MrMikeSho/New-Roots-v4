<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marketplace – Rudo Roots</title>
<meta name="description" content="Jobs, housing and community listings for single parents.">
<meta name="theme-color" content="#c2570c">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="listings">
  <div class="hero">
    <span class="eyebrow soft">Village Marketplace</span>
    <h1>Deals Near You</h1>
    <p>Jobs, housing, and community spaces across Zimbabwe</p>
  </div>
  <div class="panel">
    <input class="search" id="q" placeholder="🔍  Search listings...">
    <div class="chips" id="cities"></div>
    <div class="chips" id="cats"></div>
    <div style="margin-top:16px"><button class="btn" id="post">＋ Post a Listing</button></div>
  </div>
  <div class="cats" id="catcards"></div>
  <div class="list" id="list"></div>
  <div class="count" id="count"></div>
</main>
<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 style="margin:0 0 4px;font-size:24px">Post a Listing</h3>
    <small>Listings appear after the Village team approves them.</small>
    <label>Title</label><input name="title" required maxlength="90">
    <label>Category</label><select name="category"><option value="jobs">Jobs &amp; Piece Work</option><option value="housing">Housing</option><option value="community">Churches &amp; Community</option></select>
    <label>City</label><select name="city"><option>Harare</option></select>
    <label>Description</label><textarea name="description" rows="3" required maxlength="400"></textarea>
    <label>Price (e.g. $50/week, Free)</label><input name="price" maxlength="30">
    <label>Your name</label><input name="contact_name" required maxlength="40">
    <label>Phone / WhatsApp</label><input name="phone" required inputmode="tel" placeholder="+2637...">
    <label>Photos or files (optional)</label>
    <label class="filebtn" for="mfile">📷 Add photos / files</label><input type="file" id="mfile" accept="image/*,application/pdf" multiple hidden>
    <div class="thumbs" id="mthumbs"></div><small style="color:#6b7280">Up to 3 · photos are shrunk automatically to save data</small>
    <div class="row" style="margin-top:18px"><button class="btn" type="submit">Submit</button><button class="chip" type="button" id="cancel">Cancel</button></div>
    <div class="msg" id="msg"></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="social.js"></script>
<script src="market.js"></script>
</body>
</html>
