<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saved posts – Rudo Roots</title>
<meta name="description" content="Posts you saved to view later.">
<meta name="theme-color" content="#c2570c">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main><div class="page-head"><span class="eyebrow soft">Your list</span><h1>Saved posts</h1><p>Posts you saved to view later</p></div><div class="wrap" style="max-width:820px;padding-bottom:60px"><div class="flist" id="saved"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="social.js"></script>
<script>
function paintSaved(rows){
  $("#saved").innerHTML=rows.map(r=>r._t==="post"?postCard(r):listingCard(r)).join("")||'<div class="empty">Nothing saved yet. Tap the 🏷 on any post to keep it here.</div>';
  armReveal();
}
async function loadSaved(){
  const keys=[...MYS];if(!keys.length)return paintSaved([]);
  const ids=t=>keys.filter(k=>k.startsWith(t+":")).map(k=>k.slice(t.length+1));
  let rows=[];
  if(LIVE){
    const [a,b]=await Promise.all([ids("post").length?db.from("posts").select("*").in("id",ids("post")):{data:[]},ids("listing").length?db.from("listings").select("*").in("id",ids("listing")):{data:[]}]);
    rows=[...(a.data||[]).map(r=>({...r,_t:"post"})),...(b.data||[]).map(r=>({...r,_t:"listing"}))];
  }else rows=[...posts.map(r=>({...r,_t:"post"})),...listings.map(r=>({...r,_t:"listing"}))].filter(r=>MYS.has(key(r._t,r.id)));
  paintSaved(rows);
}
window.pageRefresh=loadSaved;
boot().then(()=>{if(LIVE&&!USER){openAuth("Log in to see your saved posts.");$("#authdlg").addEventListener("close",()=>{if(!USER)location.href="index.html"})}else loadSaved()});
</script>
</body>
</html>
